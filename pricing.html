<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWJ · الباقات</title>
<meta name="description" content="باقات الأوج: أفراد، شركات، وكيانات سياسية — تسعير بالقيمة قابل للتوطين حسب المنطقة.">
<link rel="icon" href="assets/img/awj-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Reem+Kufi:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/awj.css">
</head>
<body>

<header class="nav">
  <div class="container">
    <a class="brand" href="index.html"><img src="assets/img/awj-mark.svg" alt=""><span class="wm">A<b>W</b>J</span></a>
    <nav class="nav-links">
      <a href="platform.html" data-i18n="nav.platform">المنصة</a>
      <a href="pricing.html" aria-current="page" data-i18n="nav.pricing">الباقات</a>
      <a href="trust.html" data-i18n="nav.trust">الأخلاقيات</a>
      <a href="dashboard.html" data-i18n="nav.demo">العرض الحي</a>
      <a href="contact.html" data-i18n="nav.contact">تواصل</a>
    </nav>
    <div class="nav-actions">
      <div class="lang" role="group" aria-label="language">
        <button data-lang="ar" aria-pressed="true">ع</button>
        <button data-lang="fr" aria-pressed="false">FR</button>
        <button data-lang="en" aria-pressed="false">EN</button>
      </div>
      <a href="contact.html" class="btn btn-primary" data-i18n="cta.start">ابدأ الآن</a>
    </div>
    <button class="menu-toggle" aria-label="menu">☰</button>
  </div>
</header>

<section class="hero" style="padding-bottom:24px">
  <div class="container">
    <span class="eyebrow" data-i18n="pricing.eyebrow">الباقات</span>
    <h1 style="font-size:clamp(2.2rem,5vw,3.6rem);margin:16px 0 18px" data-i18n="pricing.title">تسعيرٌ يوازي قيمة ما تحميه.</h1>
    <p class="lead" data-i18n="pricing.lead"></p>
  </div>
</section>

<section class="section" style="padding-top:24px">
  <div class="container">
    <div class="tiers">
      <!-- Individuals -->
      <article class="tier reveal">
        <h3 data-i18n="t1.name">الأفراد</h3>
        <p class="who" data-i18n="t1.who"></p>
        <div class="price"><span data-i18n="t1.p">٤٩$</span> <small data-i18n="t1.per">/ شهرياً</small></div>
        <ul>
          <li data-i18n="t1.f1"></li><li data-i18n="t1.f2"></li><li data-i18n="t1.f3"></li>
          <li data-i18n="t1.f4"></li><li data-i18n="t1.f5"></li>
        </ul>
        <a href="contact.html" class="btn btn-ghost" data-i18n="cta.start">ابدأ الآن</a>
      </article>

      <!-- Companies (featured) -->
      <article class="tier feature reveal" style="transition-delay:.08s">
        <span class="badge" data-i18n="t2.badge">الأكثر طلباً</span>
        <h3 data-i18n="t2.name">الشركات</h3>
        <p class="who" data-i18n="t2.who"></p>
        <div class="price"><span data-i18n="t2.p">٣٩٩$</span> <small data-i18n="t2.per">/ شهرياً</small></div>
        <ul>
          <li data-i18n="t2.f1"></li><li data-i18n="t2.f2"></li><li data-i18n="t2.f3"></li>
          <li data-i18n="t2.f4"></li><li data-i18n="t2.f5"></li><li data-i18n="t2.f6"></li>
        </ul>
        <a href="contact.html" class="btn btn-primary" data-i18n="cta.book">احجز عرضاً</a>
      </article>

      <!-- Political -->
      <article class="tier political reveal" style="transition-delay:.16s">
        <span class="badge" data-i18n="t3.badge">مُخصّص</span>
        <h3 data-i18n="t3.name">الكيانات السياسية</h3>
        <p class="who" data-i18n="t3.who"></p>
        <div class="price"><span data-i18n="t3.p">حسب الطلب</span> <small data-i18n="t3.per">يبدأ من ٢٥٠٠$</small></div>
        <ul>
          <li data-i18n="t3.f1"></li><li data-i18n="t3.f2"></li><li data-i18n="t3.f3"></li>
          <li data-i18n="t3.f4"></li><li data-i18n="t3.f5"></li>
        </ul>
        <a href="contact.html" class="btn btn-ghost" data-i18n="cta.book">احجز عرضاً</a>
      </article>
    </div>
    <p class="pricing-note" data-i18n="pricing.foot"></p>
  </div>
</section>

<footer>
  <div class="container">
    <div class="foot-bottom" style="border:none;margin:0;padding:0">
      <span data-i18n="foot.rights">© 2026 الأوج.</span>
      <span data-i18n="foot.made">صُمّم بالعربية أولاً.</span>
    </div>
  </div>
</footer>

<script src="assets/js/awj.js"></script>
</body>
</html>
