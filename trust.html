<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWJ · الأخلاقيات</title>
<meta name="description" content="ميثاق الأوج: إدارة سمعة مشروعة قائمة على الشرعية — ما نفعله وما لن نفعله أبداً.">
<link rel="icon" href="assets/img/awj-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Reem+Kufi:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/awj.css">
</head>
<body>

<header class="nav">
  <div class="container">
    <a class="brand" href="index.html"><img src="assets/img/awj-mark.svg" alt=""><span class="wm">A<b>W</b>J</span></a>
    <nav class="nav-links">
      <a href="platform.html" data-i18n="nav.platform">المنصة</a>
      <a href="pricing.html" data-i18n="nav.pricing">الباقات</a>
      <a href="trust.html" aria-current="page" data-i18n="nav.trust">الأخلاقيات</a>
      <a href="dashboard.html" data-i18n="nav.demo">العرض الحي</a>
      <a href="contact.html" data-i18n="nav.contact">تواصل</a>
    </nav>
    <div class="nav-actions">
      <div class="lang" role="group" aria-label="language">
        <button data-lang="ar" aria-pressed="true">ع</button>
        <button data-lang="fr" aria-pressed="false">FR</button>
        <button data-lang="en" aria-pressed="false">EN</button>
      </div>
      <a href="contact.html" class="btn btn-primary" data-i18n="cta.start">ابدأ الآن</a>
    </div>
    <button class="menu-toggle" aria-label="menu">☰</button>
  </div>
</header>

<section class="hero" style="padding-bottom:24px">
  <div class="container" style="max-width:760px">
    <span class="eyebrow" data-i18n="trust.eyebrow">ميثاق الأوج</span>
    <h1 style="font-size:clamp(2rem,4.5vw,3.2rem);margin:16px 0 18px" data-i18n="trust.title">القوة بلا نزاهة تُدمّر السمعة التي تحميها.</h1>
    <p class="lead" data-i18n="trust.lead"></p>
  </div>
</section>

<section class="section" style="padding-top:24px">
  <div class="container">
    <div class="pledge">
      <div class="card do reveal">
        <h4>✓ <span data-i18n="do.t">ما نفعله</span></h4>
        <ul class="do">
          <li data-i18n="do.1"></li>
          <li data-i18n="do.2"></li>
          <li data-i18n="do.3"></li>
          <li data-i18n="do.4"></li>
        </ul>
      </div>
      <div class="card dont reveal" style="transition-delay:.08s">
        <h4 style="color:var(--crimson)">✕ <span data-i18n="dont.t">ما لا نفعله</span></h4>
        <ul class="dont">
          <li data-i18n="dont.1"></li>
          <li data-i18n="dont.2"></li>
          <li data-i18n="dont.3"></li>
          <li data-i18n="dont.4"></li>
        </ul>
      </div>
    </div>

    <div class="cta-band reveal mt-l">
      <h2 data-i18n="why.title">مبنيّ ليتفوّق، لا ليُقلَّد.</h2>
      <p class="lead" style="margin-inline:auto" data-i18n="why.i3"></p>
      <a href="contact.html" class="btn btn-primary" data-i18n="cta.book">احجز عرضاً</a>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="foot-bottom" style="border:none;margin:0;padding:0">
      <span data-i18n="foot.rights">© 2026 الأوج.</span>
      <span data-i18n="foot.made">صُمّم بالعربية أولاً.</span>
    </div>
  </div>
</footer>

<script src="assets/js/awj.js"></script>
</body>
</html>
